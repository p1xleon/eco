name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # pubspec lists .env as an asset, so it must exist for analyze and test.
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test
